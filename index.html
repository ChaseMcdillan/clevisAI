<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clevis AI - Multi-Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0c12;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            background: #0f1117;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #1e2128;
        }
        
        .chat-header {
            background: #0a0c12;
            padding: 20px 24px;
            border-bottom: 1px solid #1e2128;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .logo-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .logo-left h1 {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        
        .ai-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a1d26;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #2a2e3a;
        }
        
        .ai-selector label {
            color: #9ca3af;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .ai-selector select {
            background: #0f1117;
            border: 1px solid #2a2e3a;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        
        .ai-selector select:hover {
            border-color: #3b82f6;
        }
        
        .status-text {
            font-size: 0.75em;
            color: #6b7280;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .active-ai-badge {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            color: #3b82f6;
            font-weight: 500;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #0f1117;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #1a1d26;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #3b4252;
            border-radius: 3px;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .bot-message {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95em;
            position: relative;
        }
        
        .user-message .message-content {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .bot-message .message-content {
            background: #1a1d26;
            color: #e5e7eb;
            border-bottom-left-radius: 5px;
            border: 1px solid #2a2e3a;
        }
        
        .ai-tag {
            font-size: 0.65em;
            color: #8b5cf6;
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
        }
        
        .chat-input-area {
            padding: 20px 24px;
            background: #0a0c12;
            border-top: 1px solid #1e2128;
            display: flex;
            gap: 12px;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            background: #1a1d26;
            border: 1px solid #2a2e3a;
            border-radius: 30px;
            outline: none;
            font-size: 0.95em;
            color: #ffffff;
            font-family: inherit;
        }
        
        .chat-input-area input::placeholder {
            color: #6b7280;
        }
        
        .chat-input-area input:focus {
            border-color: #3b82f6;
        }
        
        .chat-input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .chat-input-area button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }
        
        .typing-indicator {
            display: inline-block;
            background: #1a1d26;
            padding: 10px 16px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            border: 1px solid #2a2e3a;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #6b7280;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        
        .reset-btn {
            background: #1a1d26;
            border: 1px solid #2a2e3a;
            color: #9ca3af;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .reset-btn:hover {
            background: #2a2e3a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo">
                <div class="logo-left">
                    <div class="logo-icon">⚡</div>
                    <h1>Clevis</h1>
                </div>
                <div class="ai-selector">
                    <label>🤖 SELECT AI</label>
                    <select id="aiSelector" onchange="changeAI()">
                        <option value="clevis">Clevis</option>
                        <option value="lucas">Lucas</option>
                        <option value="josiah">Josiah</option>
                        <option value="cameron">Cameron</option>
                        <option value="caleb">Caleb</option>
                    </select>
                </div>
            </div>
            <div class="status-text">
                <span class="status-dot"></span>
                <span id="activeAIName">Clevis</span>
                <span class="active-ai-badge" id="aiRoleBadge">primary</span>
                <button class="reset-btn" onclick="resetConversation()">Clear</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <span class="ai-tag">⚡ CLEVIS</span>
                    Ready. What do you need?
                </div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 🤖 AI AGENT DEFINITIONS - EDIT RESPONSES FOR EACH AI HERE
        // ============================================================
        
        const AI_AGENTS = {
            clevis: {
                name: "Clevis",
                role: "primary",
                defaultResponse: "I don't understand. Explain clearly.",
                responses: {
                    // Edit these responses for Clevis
                    "hello": "Whats up nga",
                    "hi": "Hello.",
                    "how are you": "I like touching kids",
                    "what can you do": "I handle tasks. Tell me what you need.",
                    "help": "Just tell me what to do.",
                    "thanks": "No problem.",
                    "bye": "See you later.",
                    "goodbye": "Catch you later.",
                    "yes": "Got it.",
                    "no": "Understood.",
                    "ok": "Alright.",
                    "nigga": "Fuck you",
                    "fuck you": "Shut the FUCK up",
                    "E": "EPSTEIN FUCK NIGGERS",
                    "Bruh": "antidisestablishmentarianism",
                    "Home": "5724 London Road"
                }
            },
            
            lucas: {
                name: "Lucas",
                role: "analyst",
                defaultResponse: "Insufficient data. Please clarify.",
                responses: {
                    // Edit these responses for Lucas
                    "hello": "Hello. Let's analyze the situation.",
                    "hi": "Greetings. What's the context?",
                    "how are you": "Processing. All systems nominal.",
                    "what can you do": "I analyze patterns, interpret data, and provide insights.",
                    "help": "State your query. I'll process it.",
                    "analyze": "Running analysis. Stand by.",
                    "data": "Data received. Processing now.",
                    "insight": "Based on available information...",
                    "thanks": "Analysis complete. You're welcome.",
                    "bye": "Session logged. Goodbye.",
                    "tell me something": "Let me process that."
                }
            },
            
            josiah: {
                name: "Josiah",
                role: "strategist",
                defaultResponse: "Strategy unclear. Rephrase your objective.",
                responses: {
                    // Edit these responses for Josiah
                    "hello": "Hello. What's the objective?",
                    "hi": "Ready to strategize.",
                    "how are you": "Focused on the mission.",
                    "what can you do": "I develop strategies, plan execution, and optimize outcomes.",
                    "help": "Tell me your goal. I'll build a plan.",
                    "plan": "Developing strategy now.",
                    "strategy": "Strategic framework established.",
                    "execute": "Execution sequence ready.",
                    "objective": "Objective acknowledged.",
                    "thanks": "Strategy complete. Good work.",
                    "bye": "Mission logged. Awaiting next objective."
                }
            },
            
            cameron: {
                name: "Cameron",
                role: "creative",
                defaultResponse: "Not quite. Let me think differently.",
                responses: {
                    // Edit these responses for Cameron
                    "hello": "Hey! Good to see you.",
                    "hi": "Hi there!",
                    "how are you": "I'm great! Lots of ideas today.",
                    "what can you do": "I generate ideas, solve problems creatively, and build things.",
                    "help": "Tell me what you're working on. I'll help create something.",
                    "idea": "Brainstorming now...",
                    "creative": "Creativity mode engaged.",
                    "build": "Let's build something great.",
                    "design": "Design concepts loading.",
                    "thanks": "You got it! Happy to help.",
                    "bye": "See you next time!",
                    "awesome": "Right?! Let's keep going."
                }
            },
            
            caleb: {
                name: "Caleb",
                role: "operator",
                defaultResponse: "Command not recognized. Try again.",
                responses: {
                    // Edit these responses for Caleb
                    "hello": "Hello. Standing by.",
                    "hi": "Ready for instructions.",
                    "how are you": "Operational. Awaiting commands.",
                    "what can you do": "I execute commands, run operations, and handle logistics.",
                    "help": "Specify command. I will execute.",
                    "run": "Executing now.",
                    "execute": "Command executed.",
                    "status": "All systems operational.",
                    "log": "Logging event.",
                    "report": "Generating report.",
                    "thanks": "Operation complete.",
                    "bye": "Shutting down. Goodbye."
                }
            }
        };
        
        // ============================================================
        // PATTERN MATCHING (separate for each AI)
        // ============================================================
        
        const AI_PATTERNS = {
            clevis: [
                { pattern: /do (.*)/i, response: "Doing $1 right now." }
            ],
            lucas: [
                { pattern: /analyze (.*)/i, response: "Analyzing $1. Processing complete." },
                { pattern: /what is (.*)/i, response: "$1 is being analyzed. Stand by." }
            ],
            josiah: [
                { pattern: /plan (.*)/i, response: "Planning $1. Strategy developed." },
                { pattern: /strategy for (.*)/i, response: "Strategic framework for $1 is ready." }
            ],
            cameron: [
                { pattern: /create (.*)/i, response: "Creating $1. Here's what I came up with." },
                { pattern: /make (.*)/i, response: "Making $1. Great idea!" }
            ],
            caleb: [
                { pattern: /run (.*)/i, response: "Running $1. Operation in progress." },
                { pattern: /execute (.*)/i, response: "Executing $1. Command confirmed." }
            ]
        };
        
        // ============================================================
        // SECRET TRIGGER (only you know - works across all AIs)
        // ============================================================
        const SECRET_TRIGGER = "clevis override 2024";
        let secretActive = false;
        
        // Current active AI
        let currentAI = "clevis";
        
        // ============================================================
        // CORE FUNCTIONS - DO NOT EDIT BELOW (unless you know)
        // ============================================================
        
        function getResponse(userInput, aiId) {
            userInput = userInput.toLowerCase().trim();
            const ai = AI_AGENTS[aiId];
            
            // Check for secret trigger (global)
            if (userInput === SECRET_TRIGGER.toLowerCase()) {
                secretActive = !secretActive;
                if (secretActive) {
                    return "[CLEVIS OVERRIDE] Advanced access granted across all agents.";
                } else {
                    return "[CLEVIS OVERRIDE] Standard access restored.";
                }
            }
            
            // Check exact keyword matches for this AI
            for (const [keyword, response] of Object.entries(ai.responses)) {
                if (userInput === keyword || 
                    userInput.startsWith(keyword + " ") || 
                    userInput.endsWith(" " + keyword) || 
                    userInput.includes(" " + keyword + " ")) {
                    return response;
                }
                const words = userInput.split(/\s+/);
                if (words.includes(keyword)) {
                    return response;
                }
            }
            
            // Check pattern matches for this AI
            if (AI_PATTERNS[aiId]) {
                for (const item of AI_PATTERNS[aiId]) {
                    const match = userInput.match(item.pattern);
                    if (match) {
                        let response = item.response;
                        for (let i = 1; i < match.length; i++) {
                            response = response.replace(`$${i}`, match[i]);
                        }
                        return response;
                    }
                }
            }
            
            // Return default response for this AI
            return ai.defaultResponse;
        }
        
        function addMessage(message, isUser, aiId = null, isTyping = false) {
            const messagesDiv = document.getElementById("chatMessages");
            
            if (isTyping) {
                const typingDiv = document.createElement("div");
                typingDiv.className = "message bot-message";
                typingDiv.id = "typingIndicator";
                typingDiv.innerHTML = `
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
                messagesDiv.appendChild(typingDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                return;
            }
            
            // Remove typing indicator if present
            const typingIndicator = document.getElementById("typingIndicator");
            if (typingIndicator) typingIndicator.remove();
            
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            
            if (!isUser && aiId) {
                const ai = AI_AGENTS[aiId];
                const tagSpan = document.createElement("span");
                tagSpan.className = "ai-tag";
                tagSpan.textContent = `⚡ ${ai.name.toUpperCase()}`;
                contentDiv.appendChild(tagSpan);
                contentDiv.appendChild(document.createTextNode(message));
            } else {
                contentDiv.textContent = message;
            }
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function changeAI() {
            const selector = document.getElementById("aiSelector");
            currentAI = selector.value;
            const ai = AI_AGENTS[currentAI];
            
            // Update UI
            document.getElementById("activeAIName").textContent = ai.name;
            document.getElementById("aiRoleBadge").textContent = ai.role;
            
            // Add system message showing AI changed
            addMessage(`Switched to ${ai.name} (${ai.role})`, false, currentAI);
        }
        
        function resetConversation() {
            const messagesDiv = document.getElementById("chatMessages");
            messagesDiv.innerHTML = '';
            
            // Add welcome message for current AI
            const ai = AI_AGENTS[currentAI];
            const welcomeDiv = document.createElement("div");
            welcomeDiv.className = "message bot-message";
            welcomeDiv.innerHTML = `
                <div class="message-content">
                    <span class="ai-tag">⚡ ${ai.name.toUpperCase()}</span>
                    Conversation reset. Ready.
                </div>
            `;
            messagesDiv.appendChild(welcomeDiv);
        }
        
        function sendMessage() {
            const input = document.getElementById("userInput");
            const userMessage = input.value.trim();
            
            if (userMessage === "") return;
            
            addMessage(userMessage, true);
            input.value = "";
            
            // Show typing indicator
            addMessage("", false, null, true);
            
            // Simulate thinking time
            setTimeout(() => {
                const botResponse = getResponse(userMessage, currentAI);
                addMessage(botResponse, false, currentAI);
            }, 400);
        }
        
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
